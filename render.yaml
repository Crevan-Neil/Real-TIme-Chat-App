services:
  # Backend Server
  - type: web
    name: chat-server
    plan: free
    runtime: docker
    dockerContext: server
    dockerfilePath: server/Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set this in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false # Get a free URL from Upstash.com
      - key: FRONTEND_ORIGIN
        sync: false # Paste your Public Client URL here after deployment

  # Frontend Client (Nginx)
  - type: web
    name: chat-client
    plan: free
    runtime: docker
    dockerContext: client
    dockerfilePath: client/Dockerfile
