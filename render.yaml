services:
  # Backend Server
  - type: web
    name: chat-server
    plan: free
    runtime: docker
    dockerContext: server
    dockerfilePath: server/Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set this in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false # Paste your Public Client URL here after deployment (e.g. https://chat-client.onrender.com)
      - key: REDIS_URL
        fromService:
          type: redis
          name: chat-redis
          property: connectionString
      # Add other keys like CLOUDINARY if needed
      # - key: CLOUDINARY_CLOUD_NAME
      #   sync: false

  # Frontend Client
  - type: web
    name: chat-client
    plan: free
    runtime: docker
    dockerContext: client
    dockerfilePath: client/Dockerfile
    # Note: VITE_API_URL is not needed here as Nginx proxies /api requests locally

  # Managed Redis
  - type: redis
    name: chat-redis
    ipAllowList: [] # Only allow internal traffic
